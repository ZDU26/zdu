<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Согласие на обработку персональных данных</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8e8e8;color:#222;font:16px system-ui,sans-serif}header{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;background:#fff;border-bottom:1px solid #ccc}button,a{font:inherit}button{border:1px solid #888;border-radius:4px;background:white;padding:5px 12px;cursor:pointer}a{color:#174e85}#pages{padding:12px;display:flex;flex-direction:column;align-items:center;gap:12px;overflow:auto}canvas{display:block;background:white;max-width:none;box-shadow:0 1px 4px #999}#status{padding:10px 14px;margin:0}
</style></head><body><header><button id="minus" type="button" aria-label="Уменьшить">−</button><button id="plus" type="button" aria-label="Увеличить">+</button><a href="agreement.pdf" target="_blank" rel="noopener">Открыть PDF</a></header><p id="status" role="status">Загрузка документа…</p><main id="pages" aria-label="Страницы документа"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>
(function(){const url="agreement.pdf",pages=document.getElementById("pages"),status=document.getElementById("status");let doc=null,zoom=1,version=0;if(!window.pdfjsLib){status.textContent="Не удалось загрузить просмотрщик. Откройте PDF по ссылке выше.";return}pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
async function draw(){if(!doc)return;const current=++version;pages.replaceChildren();status.textContent="Загрузка страниц…";try{for(let i=1;i<=doc.numPages;i++){const page=await doc.getPage(i);if(current!==version)return;const base=page.getViewport({scale:1});const width=Math.max(280,pages.clientWidth-24);const cssScale=Math.min(width/base.width,1.5)*zoom;const ratio=Math.min(window.devicePixelRatio||1,2);const view=page.getViewport({scale:cssScale*ratio});const canvas=document.createElement("canvas");canvas.width=Math.floor(view.width);canvas.height=Math.floor(view.height);canvas.style.width=(view.width/ratio)+"px";canvas.style.height=(view.height/ratio)+"px";canvas.setAttribute("aria-label","Страница "+i+" из "+doc.numPages);pages.appendChild(canvas);await page.render({canvasContext:canvas.getContext("2d"),viewport:view}).promise;}if(current===version)status.textContent="";}catch(e){if(current===version)status.textContent="Не удалось отобразить документ. Откройте PDF по ссылке выше.";}}
document.getElementById("minus").addEventListener("click",()=>{zoom=Math.max(.75,zoom-.25);draw()});document.getElementById("plus").addEventListener("click",()=>{zoom=Math.min(2.5,zoom+.25);draw()});let timer;window.addEventListener("resize",()=>{clearTimeout(timer);timer=setTimeout(draw,250)});pdfjsLib.getDocument(url).promise.then(d=>{doc=d;draw()}).catch(()=>{status.textContent="Не удалось загрузить документ. Откройте PDF по ссылке выше."});})();
</script></body></html>
